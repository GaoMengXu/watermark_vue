<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>selftest</title></head>
<body style="font:14px sans-serif;background:#fff;padding:18px;margin:0">
<div id="r1">图片：运行中…</div>
<img id="img" style="max-width:400px;display:block;margin:8px 0;border:1px solid #ddd">
<div id="r2">PDF：运行中…</div>
<div id="r3">PDF 预览：运行中…</div>
<div id="s1">s1 未开始</div>
<div id="s2">s2 未开始</div>
<div id="s3">s3 未开始</div>
<div id="s4">s4 未开始</div>
<canvas id="cv" style="max-width:400px;display:block;margin:8px 0;border:1px solid #ddd"></canvas>
<script type="module">
const put = (id, t) => { document.getElementById(id).textContent = t }
window.addEventListener('error', e => put('s1', 'JS ERROR: ' + e.message))
window.addEventListener('unhandledrejection', e => put('s2', 'REJECTION: ' + (e.reason?.message || e.reason)))

import { applyWatermarkToImage, applyWatermarkToPDF, renderPDFPage } from '/src/utils/watermark.js'
const opts = { text: '仅供项目及合同使用', color: '#B8B8B8', opacity: 0.32 }

function makeTestImage() {
  const c = document.createElement('canvas')
  c.width = 600; c.height = 420
  const x = c.getContext('2d')
  const g = x.createLinearGradient(0, 0, 600, 420)
  g.addColorStop(0, '#4a6cf7'); g.addColorStop(0.5, '#c56bd0'); g.addColorStop(1, '#9ad86a')
  x.fillStyle = g; x.fillRect(0, 0, 600, 420)
  x.fillStyle = '#fff'; x.font = 'bold 30px sans-serif'
  x.fillText('TEST DOCUMENT', 50, 90)
  return new Promise(res => c.toBlob(b => res(new File([b], '测试图片.png', { type: 'image/png' })), 'image/png'))
}

try {
  const f = await makeTestImage()
  const r = await applyWatermarkToImage(f, opts)
  document.getElementById('img').src = URL.createObjectURL(r.blob)
  put('r1', `OK 图片 | ${r.out.name} | ${r.blob.size} B | ${r.width}x${r.height}`)
} catch (e) { put('r1', 'FAIL 图片 ' + e.message) }

try {
  put('s1', 's1 fetching pdf')
  const resp = await fetch('/_test.pdf')
  put('s1', `s1 fetched ${resp.status} ${resp.headers.get('content-type')}`)
  const b = await resp.blob()
  const f = new File([b], '测试文档.pdf', { type: 'application/pdf' })
  put('s2', `s2 file ready ${f.size} B`)
  const r = await applyWatermarkToPDF(f, opts)
  put('s3', `s3 pdf done ${r.blob.size} B / ${r.pageCount} 页`)
  put('r2', `OK PDF | ${r.out.name} | ${r.blob.size} B | ${r.pageCount} 页`)
  const n = await renderPDFPage(r.blob, 1, document.getElementById('cv'), 400)
  put('s4', 's4 preview rendered')
  put('r3', `OK 预览 | ${n} 页`)
} catch (e) {
  put('r2', 'FAIL PDF ' + e.message)
  put('r3', String(e.stack || '').slice(0, 300))
}
</script>
</body></html>
